plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.koloda'
version = '0.0.1'

expoModule {
  v2 true
}

android {
  namespace "expo.modules.kolodasecrets"
}

dependencies {
  // WHY: the vault implements `SecretVault` from the Kotlin bindings uniffi-bindgen-react-native generates into the
  // `@koloda/mobile-native` module; autolinking names that Gradle project after the npm package.
  implementation project(':koloda_mobile-native')
}
