# uniffi-bindgen-react-native: builds `koloda-mobile` and generates its React Native module here.
rust:
  directory: ../../..
  manifestPath: apps/mobile/src-rust/Cargo.toml
bindings:
  cpp: cpp/generated
  ts: src/generated
android:
  directory: android
  # WHY: link the `cdylib` the crate builds anyway, instead of adding a `staticlib` to every desktop build.
  useSharedLibrary: true
  targets:
    - arm64-v8a
    - x86_64
