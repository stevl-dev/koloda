[package]
name = "koloda-sync-proto"
version = "0.0.1"
edition = "2021"
# One explicit test binary (`protocol`). Do not add `tests/*.rs` crate roots.
autotests = false

[lints]
workspace = true

[[test]]
name = "protocol"
path = "tests/protocol/main.rs"

[dependencies]
ciborium = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
sha2 = "0.10"

[package.metadata.cargo-machete]
# WHY: used only by name in `#[serde(with = "serde_bytes")]` attributes, which cargo machete does not read.
ignored = ["serde_bytes"]
